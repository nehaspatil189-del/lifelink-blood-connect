<!DOCTYPE html>

<html>

<head>

<title>LifeLink Blood Connect</title>

<style>

body {

font-family: Arial;

background: #f5f5f5;

text-align: center;

}

.container {

margin-top: 50px;

}

h1 {

color: red;

}

.card {

display: inline-block;

width: 250px;

padding: 20px;

margin: 20px;

border-radius: 10px;

background: white;

box-shadow: 0 0 10px gray;

}

button {

padding: 10px 20px;

border: none;

background: red;

color: white;

border-radius: 5px;

cursor: pointer;

}

.blue {

background: blue;

}

</style>

</head>

<body>

<div class="container">

<h1>LifeLink Blood Connect</h1>

<h3>Donate Blood, Save Lives </h3>
<div class="card">
<h2>Donor</h2>
<p>Register and donate blood</p>

<button onclick="location.href='login.html">I am Donor</button>

</div>

<div class="card">

<h2>Acceptor</h2>

<p>Find and request blood</p>

<button class="blue" onclick="location.href='login.html">I Need Blood</button>

</div>

</div>

</body>

</html>
